services:
  db:
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    environment:
      POSTGRES_USER: ${PG_USER:-advisor}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-advisor}
      POSTGRES_DB: ${MAINT_DB:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    shm_size: 1g
    ports: ["${PG_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    env_file: .env
    environment:
      PG_HOST: db
      PG_PORT: 5432
      META_DB_PATH: /app/data/meta.sqlite
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/data
      - ./experiments:/experiments
      - ./docs:/docs:ro
    ports: ["8000:8000"]
volumes:
  pgdata: {}
